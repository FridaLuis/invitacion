  <style>

    html,

    }

  </style>



  <!-- ==================================================
       REDIRECCIÓN INMEDIATA
       ================================================== -->

  <script>

    const BASE_INVITACION =
      "https://script.google.com/macros/s/AKfycbyOuRU9lA8Eg-kt_YCrPn6hnU4MJFP_do8alDYt_pno1fK86ppHO_MmBnu-ZstO7Y7T/exec";


    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const codigo =
      parametros.get(
        "codigo"
      );


    let destino =
      BASE_INVITACION;


    if (codigo) {

      destino +=
        "?codigo=" +
        encodeURIComponent(
          codigo
        );

    }


    /*
      REDIRECCIÓN INMEDIATA.

      No esperamos 350 ms
      y no renderizamos ningún mensaje.
    */

    window.location.replace(
      destino
    );

  </script>
