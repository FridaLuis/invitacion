       PANTALLA LIMPIA DURANTE LA REDIRECCIÓN
       ================================================== -->

  <style>

    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      background: #f4f1ec;
    }


    body {
      overflow: hidden;
    }

  </style>



  <!-- ==================================================
       REDIRECCIÓN A LA INVITACIÓN REAL
       ================================================== -->

  <script>

    const BASE_INVITACION =
      "https://script.google.com/macros/s/AKfycbyOuRU9lA8Eg-kt_YCrPn6hnU4MJFP_do8alDYt_pno1fK86ppHO_MmBnu-ZstO7Y7T/exec";


    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const codigo =
      parametros.get(
        "codigo"
      );


    let destino =
      BASE_INVITACION;


    if (codigo) {

      destino +=
        "?codigo=" +
        encodeURIComponent(
          codigo
        );

    }


    /*
      REDIRECCIÓN INMEDIATA

      Solo utilizamos el parámetro "codigo".

      Cualquier parámetro extra como:
      &v=5
      &v=6
      &prueba=1

      sirve para generar una URL distinta
      para WhatsApp, pero NO se envía
      a Apps Script ni altera la invitación.
    */

    window.location.replace(
      destino
    );

  </script>
