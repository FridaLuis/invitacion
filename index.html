    body {

    .mensaje p {
      margin: 0;

      font-size: 18px;

      font-style: italic;

      letter-spacing: 0.08em;
    }


    .mensaje a {
      display: inline-block;

      margin-top: 22px;

      color: #3d3b3a;

      font-family:
        Arial,
        sans-serif;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 0.16em;

      text-transform: uppercase;

    }

<body>


  <div class="mensaje">

    <p>
      Abriendo invitación…
    </p>

    <a
      id="enlaceManual"
      href="#"
    >
      ABRIR INVITACIÓN
    </a>

  </div>



  <script>

    const BASE_INVITACION =
      "https://script.google.com/macros/s/AKfycbyOuRU9lA8Eg-kt_YCrPn6hnU4MJFP_do8alDYt_pno1fK86ppHO_MmBnu-ZstO7Y7T/exec";


    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const codigo =
      parametros.get(
        "codigo"
      );


    let destino =
      BASE_INVITACION;


    if (codigo) {

      destino +=
        "?codigo=" +
        encodeURIComponent(
          codigo
        );

    }


    document
      .getElementById(
        "enlaceManual"
      )
      .href =
        destino;


    /*
      IMPORTANTE:

      La redirección es con JavaScript y NO con
      meta refresh.

      Así WhatsApp puede leer primero
      la portada, título y descripción de esta página.
    */

    setTimeout(
      function () {

        window.location.replace(
          destino
        );

      },
      350
    );

  </script>


</body>
